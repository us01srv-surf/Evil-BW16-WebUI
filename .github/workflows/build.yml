name: Build BW16 firmware

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-bw16:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install Realtek AmebaD core
        run: |
          arduino-cli config add board_manager.additional_urls \
            https://github.com/ambiot/ambd_arduino/raw/master/Arduino_package/package_realtek_amebad_index.json
          arduino-cli core update-index
          arduino-cli core install realtek:AmebaD

      - name: Raise lwIP TCP PCB pools (TIME_WAIT holds MEMP_NUM_TCP_PCB=10;
          ~12 short-lived HTTP/WS conns in TIME_WAIT exhaust it -> tcp_new
          fails -> server bind gets EINVAL and restore dies)
        run: |
          OPTS=$(find ~/.arduino15/packages/realtek -name lwipopts.h -path '*api/network*' | head -1)
          echo "patching $OPTS"
          sed -i -E 's/^#define MEMP_NUM_TCP_PCB[[:space:]]+[0-9]+/\#define MEMP_NUM_TCP_PCB        32/' "$OPTS"
          sed -i -E 's/^#define MEMP_NUM_TCP_PCB_LISTEN[[:space:]]+[0-9]+/\#define MEMP_NUM_TCP_PCB_LISTEN 8/' "$OPTS"
          grep -n 'define MEMP_NUM_TCP_PCB' "$OPTS"
          grep -q 'MEMP_NUM_TCP_PCB        32' "$OPTS" || { echo 'SED FAILED: pool not raised'; exit 1; }
          grep -q 'MEMP_NUM_TCP_PCB_LISTEN 8' "$OPTS" || { echo 'SED FAILED: listen pool not raised'; exit 1; }

      - name: SO_REUSEADDR in start_server (short-lived HTTP conns leave TIME_WAIT
          PCBs on :80 which survive the sniff/restore netif cycle and make tcp_bind
          return ERR_USE -> 'ERROR on binding'; reuseaddr skips the TW scan but
          still rejects live listeners)
        run: |
          SRC=$(find ~/.arduino15/packages/realtek -name ard_socket.c | head -1)
          echo "patching $SRC"
          python3 - "$SRC" <<'EOF'
          import sys
          p = sys.argv[1]
          s = open(p).read()
          anchor = "    localHost.sin_addr.s_addr = INADDR_ANY;"
          inject = anchor + "\n    { int _yes = 1; setsockopt(_sock, SOL_SOCKET, SO_REUSEADDR, &_yes, sizeof(_yes)); } // CI: tolerate TIME_WAIT on rebind"
          n = s.count(anchor)
          assert n == 1, "anchor count=%d" % n
          open(p, "w").write(s.replace(anchor, inject))
          print("patched SO_REUSEADDR into start_server")
          EOF
          grep -n "SO_REUSEADDR" "$SRC"

      - name: Compile Evil-BW16 sketch
        run: |
          arduino-cli compile \
            --fqbn realtek:AmebaD:Ai-Thinker_BW16 \
            --warnings default \
            --build-path "$GITHUB_WORKSPACE/build" \
            Evil-BW16

      - name: Dump preprocessed sketch on failure
        if: failure()
        run: |
          echo "=== sketch files in build dir ==="
          find build -name '*.ino.cpp' -o -name '*.cpp' | head -20 || true
          INOCPP=$(find build -name 'Evil-BW16.ino.cpp' | head -1)
          if [ -n "$INOCPP" ]; then
            echo "=== first 170 lines of $INOCPP (prototype block placement) ==="
            sed -n '1,170p' "$INOCPP"
            echo "=== grep key symbols in $INOCPP ==="
            grep -n 'WiFiScanResult\|sortByChannel\|isEAPOL\|isPwnagotchiMac\|httpServerLoop\|webuiStart' "$INOCPP" | head -60 || true
            echo "=== physical lines 1885-1915 (around reported error pos) ==="
            sed -n '1885,1915p' "$INOCPP"
            echo "=== #line directives near there ==="
            grep -n '#line' "$INOCPP" | awk -F: '$1>1700 && $1<2000' | head -20
          else
            echo "no generated ino.cpp found"
            ls -laR build 2>/dev/null | head -80 || true
          fi

      - name: Collect flash image
        run: |
          find build -name 'km0_km4_image2.bin' -print -exec cp {} fw-km0_km4_image2.bin \;
          ls -la fw-km0_km4_image2.bin

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: bw16-firmware
          path: fw-km0_km4_image2.bin
          if-no-files-found: error
